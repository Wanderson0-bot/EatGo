<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Redefinir Senha | EatGo</title>
</head>
<body class="reset-page">

<div class="reset-container">
    <div class="reset-card">
        <h2 class="reset-title">Redefinir senha</h2>
        <p class="reset-subtitle">Digite sua nova senha abaixo.</p>

        <form id="reset-form" class="reset-form">
            <input class="reset-input" type="password" name="senha" placeholder="Nova senha" minlength="8" required>
            <button class="reset-button" type="submit">Salvar nova senha</button>
        </form>

        <div class="reset-message" id="msg"></div>
    </div>
</div>
    <script src="index.js"></script>
</body>
</html>
